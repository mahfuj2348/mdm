name: Build installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-smoke.cjs
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - run: npm test
      - name: Compile native messaging launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:exe /out:integration/native-host.exe integration/NativeHostLauncher.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: MDM-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Package extension and checksums
        run: |
          bash scripts/package-extension.sh
          cp release-extension/*.zip installers/
          cp THIRD-PARTY.md LICENSE installers/
          cd installers
          sha256sum *.dmg *.exe *.zip > SHA256SUMS.txt
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" installers/* --title "MDM $GITHUB_REF_NAME — Windows & macOS" --notes-file docs/RELEASE-NOTES.md --latest
